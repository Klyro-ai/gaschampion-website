name = "klyro-site"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "3a7d786ecf0b37fed098a78df2dfbf2b"

# KLYRO_API_KEY is set as a Cloudflare secret, not a plaintext var.
# Set it with: wrangler secret put KLYRO_API_KEY
# Local dev: put it in .dev.vars (gitignored)

# Service binding to the API Worker
[[services]]
binding = "API_WORKER"
service = "klyro-worker"

[assets]
binding = "ASSETS"
