name = "klyro-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Unified entry point — exports fetch (API), scheduled (cron), and queue (fetch jobs)

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "klyro-db"
database_id = "660cc50c-5ae2-4de0-a80a-2b461eddb328"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "klyro-media"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "a4f5f40181cd4f8893be404adf067985"

# Queue Producer (cron dispatches to this)
[[queues.producers]]
queue = "klyro-fetch-queue"
binding = "FETCH_QUEUE"

# Queue Consumer (same worker consumes from queue)
[[queues.consumers]]
queue = "klyro-fetch-queue"
max_batch_size = 1
max_retries = 3

# Cron trigger
[triggers]
crons = ["0 */6 * * *"]

# Non-secret vars only. Secrets are in .dev.vars (local) and wrangler secret (production)
[vars]
ENVIRONMENT = "production"
