<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <rect width="600" height="600" rx="24" fill="#F0F4FF"/>
  <!-- Boiler -->
  <rect x="200" y="120" width="200" height="300" rx="16" fill="white" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="220" y="150" width="160" height="60" rx="8" fill="#E2E8F0"/>
  <circle cx="300" cy="180" r="18" fill="#3B82F6" opacity="0.8"/>
  <rect x="240" y="230" width="120" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="240" y="250" width="80" height="8" rx="4" fill="#CBD5E1"/>
  <!-- Flame -->
  <path d="M290 290 C290 270, 310 265, 300 250 C310 265, 330 270, 320 290 C320 305, 290 305, 290 290Z" fill="#F97316" opacity="0.8"/>
  <path d="M297 290 C297 280, 307 277, 303 270 C307 277, 317 280, 312 290 C312 298, 297 298, 297 290Z" fill="#FBBF24"/>
  <!-- Pipes -->
  <rect x="170" y="200" width="30" height="8" rx="4" fill="#94A3B8"/>
  <rect x="400" y="200" width="30" height="8" rx="4" fill="#94A3B8"/>
  <rect x="170" y="300" width="30" height="8" rx="4" fill="#94A3B8"/>
  <rect x="400" y="300" width="30" height="8" rx="4" fill="#94A3B8"/>
  <!-- Engineer figure -->
  <circle cx="480" cy="340" r="28" fill="#1E40AF"/>
  <rect x="458" y="370" width="44" height="80" rx="8" fill="#1E40AF"/>
  <rect x="465" y="370" width="30" height="80" rx="6" fill="#2563EB"/>
  <!-- Hard hat -->
  <ellipse cx="480" cy="318" rx="32" ry="12" fill="#FBBF24"/>
  <!-- Wrench -->
  <rect x="510" y="390" width="40" height="8" rx="4" fill="#64748B" transform="rotate(-30 510 390)"/>
  <circle cx="543" cy="375" r="10" fill="none" stroke="#64748B" stroke-width="3"/>
  <!-- Radiator -->
  <rect x="80" y="350" width="80" height="120" rx="6" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="92" y="360" width="8" height="100" rx="4" fill="#E2E8F0"/>
  <rect x="108" y="360" width="8" height="100" rx="4" fill="#E2E8F0"/>
  <rect x="124" y="360" width="8" height="100" rx="4" fill="#E2E8F0"/>
  <rect x="140" y="360" width="8" height="100" rx="4" fill="#E2E8F0"/>
  <!-- Temperature gauge -->
  <circle cx="300" cy="360" r="24" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <line x1="300" y1="360" x2="300" y2="345" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="360" x2="312" y2="355" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Gas Safe badge -->
  <rect x="210" y="460" width="180" height="60" rx="12" fill="#1E40AF"/>
  <text x="300" y="485" text-anchor="middle" fill="white" font-family="system-ui" font-size="13" font-weight="600">GAS SAFE REGISTERED</text>
  <text x="300" y="505" text-anchor="middle" fill="#93C5FD" font-family="system-ui" font-size="11">Registration: 636427</text>
  <!-- Checkmark badges -->
  <circle cx="140" y="520" r="16" fill="#059669"/>
  <path d="M132 520 L138 526 L150 514" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="525" fill="#334155" font-family="system-ui" font-size="11">18+ Years</text>
  <circle cx="340" y="520" r="16" fill="#059669"/>
  <path d="M332 520 L338 526 L350 514" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="365" y="525" fill="#334155" font-family="system-ui" font-size="11">5-Star Rated</text>
</svg>
