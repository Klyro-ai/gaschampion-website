<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="16" fill="#F0FDF4"/>
  <!-- Simplified Suffolk/Essex map outline -->
  <path d="M200 100 C250 80, 350 70, 450 90 C520 100, 580 130, 600 180 C620 230, 610 280, 580 310 C550 340, 480 350, 400 340 C320 330, 260 310, 220 270 C180 230, 170 170, 200 100Z" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <!-- Towns -->
  <!-- Haverhill (center) -->
  <circle cx="380" cy="200" r="16" fill="#DC2626"/>
  <circle cx="380" cy="200" r="8" fill="white"/>
  <text x="380" y="235" text-anchor="middle" fill="#1F2937" font-family="system-ui" font-size="13" font-weight="700">HAVERHILL</text>
  <text x="380" y="250" text-anchor="middle" fill="#16A34A" font-family="system-ui" font-size="9" font-weight="600">HQ</text>
  <!-- Saffron Walden -->
  <circle cx="310" cy="260" r="8" fill="#3B82F6"/>
  <text x="310" y="280" text-anchor="middle" fill="#374151" font-family="system-ui" font-size="10">Saffron Walden</text>
  <!-- Bury St Edmunds -->
  <circle cx="440" cy="140" r="8" fill="#3B82F6"/>
  <text x="440" y="128" text-anchor="middle" fill="#374151" font-family="system-ui" font-size="10">Bury St Edmunds</text>
  <!-- Sudbury -->
  <circle cx="500" cy="220" r="8" fill="#3B82F6"/>
  <text x="500" y="240" text-anchor="middle" fill="#374151" font-family="system-ui" font-size="10">Sudbury</text>
  <!-- Clare -->
  <circle cx="420" cy="180" r="6" fill="#60A5FA"/>
  <text x="445" y="178" fill="#6B7280" font-family="system-ui" font-size="9">Clare</text>
  <!-- Newmarket -->
  <circle cx="310" cy="160" r="6" fill="#60A5FA"/>
  <text x="280" y="150" fill="#6B7280" font-family="system-ui" font-size="9">Newmarket</text>
  <!-- Halstead -->
  <circle cx="520" cy="270" r="6" fill="#60A5FA"/>
  <text x="545" y="268" fill="#6B7280" font-family="system-ui" font-size="9">Halstead</text>
  <!-- Cambridge -->
  <circle cx="240" cy="180" r="6" fill="#60A5FA"/>
  <text x="215" y="170" fill="#6B7280" font-family="system-ui" font-size="9">Cambridge</text>
  <!-- Kedington -->
  <circle cx="400" cy="230" r="5" fill="#93C5FD"/>
  <text x="425" y="232" fill="#9CA3AF" font-family="system-ui" font-size="8">Kedington</text>
  <!-- Connection lines from Haverhill -->
  <line x1="380" y1="200" x2="310" y2="260" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="200" x2="440" y2="140" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="200" x2="500" y2="220" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="200" x2="310" y2="160" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Coverage radius -->
  <circle cx="380" cy="200" r="120" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.4"/>
  <!-- Legend -->
  <rect x="580" y="300" width="200" height="80" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="600" cy="322" r="5" fill="#DC2626"/>
  <text x="615" y="326" fill="#374151" font-family="system-ui" font-size="10">HQ — Haverhill</text>
  <circle cx="600" cy="345" r="5" fill="#3B82F6"/>
  <text x="615" y="349" fill="#374151" font-family="system-ui" font-size="10">Key service areas</text>
  <circle cx="600" cy="368" r="4" fill="#60A5FA"/>
  <text x="615" y="372" fill="#374151" font-family="system-ui" font-size="10">Extended coverage</text>
</svg>
