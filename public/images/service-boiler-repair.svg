<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#FEF2F2"/>
  <!-- Boiler with warning -->
  <rect x="130" y="40" width="140" height="200" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="60" width="100" height="40" rx="6" fill="#FEE2E2"/>
  <circle cx="200" cy="80" r="12" fill="#DC2626" opacity="0.8"/>
  <path d="M200 72 L200 82 M200 86 L200 87" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <rect x="160" y="120" width="80" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="160" y="135" width="60" height="6" rx="3" fill="#E5E7EB"/>
  <!-- Wrench -->
  <rect x="290" y="100" width="60" height="10" rx="5" fill="#3B82F6" transform="rotate(-45 290 100)"/>
  <circle cx="330" cy="75" r="14" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <!-- Flame -->
  <path d="M190 170 C190 155, 210 150, 200 135 C210 150, 230 155, 220 170 C220 185, 190 185, 190 170Z" fill="#F97316" opacity="0.6"/>
  <!-- Arrow showing fix -->
  <path d="M280 140 L310 140 L300 130 M310 140 L300 150" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="270" text-anchor="middle" fill="#1F2937" font-family="system-ui" font-size="16" font-weight="600">Boiler Repair</text>
  <text x="200" y="290" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Same-day emergency service</text>
</svg>
