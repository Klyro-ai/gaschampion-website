<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="12" fill="#EFF6FF"/>
  <!-- Boiler -->
  <rect x="220" y="40" width="160" height="220" rx="12" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="240" y="60" width="120" height="45" rx="6" fill="#DBEAFE"/>
  <circle cx="300" cy="83" r="14" fill="#3B82F6"/>
  <path d="M293 83 L300 90 L310 78" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pressure gauge -->
  <circle cx="270" cy="140" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="270" y1="140" x2="270" y2="128" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <circle cx="330" cy="140" r="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="330" y1="140" x2="338" y2="132" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M290 190 C290 175, 310 170, 300 155 C310 170, 330 175, 320 190 C320 205, 290 205, 290 190Z" fill="#F97316" opacity="0.7"/>
  <!-- Clipboard / checklist -->
  <rect x="430" y="60" width="120" height="160" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="460" y="50" width="60" height="20" rx="4" fill="#3B82F6"/>
  <text x="490" y="64" text-anchor="middle" fill="white" font-family="system-ui" font-size="8" font-weight="600">SERVICE</text>
  {/* Check items */}
  <circle cx="452" cy="95" r="6" fill="#059669"/><path d="M449 95 L451 97 L456 92" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="465" y="91" width="70" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="452" cy="115" r="6" fill="#059669"/><path d="M449 115 L451 117 L456 112" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="465" y="111" width="55" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="452" cy="135" r="6" fill="#059669"/><path d="M449 135 L451 137 L456 132" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="465" y="131" width="65" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="452" cy="155" r="6" fill="#059669"/><path d="M449 155 L451 157 L456 152" stroke="white" stroke-width="1.5" fill="none"/>
  <rect x="465" y="151" width="50" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="452" cy="175" r="6" fill="#F59E0B"/><rect x="465" y="171" width="60" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="452" cy="195" r="6" fill="#E5E7EB"/><rect x="465" y="191" width="45" height="6" rx="3" fill="#E2E8F0"/>
  <!-- Tools -->
  <rect x="80" y="120" width="80" height="10" rx="5" fill="#64748B" transform="rotate(-20 80 120)"/>
  <circle cx="62" cy="128" r="12" fill="none" stroke="#64748B" stroke-width="2.5"/>
  <text x="300" y="300" text-anchor="middle" fill="#1E293B" font-family="system-ui" font-size="15" font-weight="600">Annual Boiler Servicing</text>
  <text x="300" y="320" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Keep your boiler safe, efficient & warranty-valid</text>
</svg>
